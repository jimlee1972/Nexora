name: Windows Editor package
on:
  workflow_dispatch:
  push:
    branches: [main, 'build/editor-*']
    paths:
      - '.github/workflows/editor-windows-package.yml'
      - 'Tools/Editor/**'
      - 'Tools/Brand/**'
      - 'Assets/Brand/**'
      - 'Apps/Editor/**'
      - 'Engine/**'
      - 'Config/Modules/**'
      - 'CMake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Cancel superseded checks on this packaging branch
        if: (github.ref == 'refs/heads/build/editor-windows-package' || github.ref == 'refs/heads/build/editor-logo-splash') && github.actor == github.repository_owner
        uses: actions/github-script@v7
        with:
          script: |
            const {cleanup} = require('./Tools/Build/editor-ci-cleanup.cjs');
            await cleanup({github, context, core});
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '3.31.6'
          ninjaVersion: '1.12.1'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependency admission
        run: python -m unittest discover -s Tools/Editor/tests -v
      - name: Configure Editor
        run: >-
          cmake --preset windows-development -B build/editor-package
          -DNEXORA_ENABLE_EDITOR=ON -DNEXORA_ENABLE_EDITOR_GRAPHICAL_SHELL=ON
          -DNEXORA_ENABLE_NATIVE_BACKENDS=ON -DNEXORA_ENABLE_2D=ON
          -DNEXORA_ENABLE_VULKAN_BACKEND=OFF -DNEXORA_ENABLE_SLANG=OFF
          -DNEXORA_ENABLE_ZIG_GAMEPLAY=ON -DNEXORA_BUILD_SHOWCASE=OFF
          -DNEXORA_BUILD_PROJECT_PLAYER=ON -DNEXORA_ENABLE_PROJECT_PLAYER_NATIVE=ON
          -DBUILD_TESTING=ON
          -DNEXORA_CRYPTOGRAPHY_BACKEND=OPENSSL
          "-DOPENSSL_ROOT_DIR=C:/Program Files/OpenSSL"
      - name: Build Editor and dependencies
        run: cmake --build build/editor-package --target NexoraEditor NexoraProjectPlayer NexoraWindowsStartupSplashTests --parallel 3
      - name: Verify embedded branding and startup lifecycle
        run: ctest --test-dir build/editor-package --output-on-failure -R '^editor\.(brand_assets|windows_startup_splash|windows_startup_integration|windows_gui_entry)$'
      - name: Package and verify relocated CLI and DX12 presentation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $editors = @(Get-ChildItem build/editor-package -Filter NexoraEditor.exe -Recurse)
          if ($editors.Count -ne 1) { throw 'Expected exactly one Editor binary' }
          $redists = @(Get-ChildItem "$env:VCToolsRedistDir/x64" -Directory -Filter 'Microsoft.VC*.CRT')
          if ($redists.Count -ne 1) { throw 'Expected exactly one x64 CRT redist directory' }
          $profiles = @(Get-ChildItem build/editor-package -Filter GameRuntime.profile -Recurse)
          if ($profiles.Count -ne 1) { throw 'Expected exactly one native game runtime profile' }
          $cmakeRoot = Split-Path (Split-Path (Get-Command cmake).Source)
          $zigRoot = Split-Path (Get-Command zig).Source
          $ninja = (Get-Command ninja).Source
          $ninjaLicense = Join-Path $env:RUNNER_TEMP 'Ninja-1.12.1-license.txt'
          Invoke-WebRequest 'https://raw.githubusercontent.com/ninja-build/ninja/v1.12.1/COPYING' -OutFile $ninjaLicense
          python Tools/Editor/PackageWindowsEditor.py `
            --openssl-root "C:/Program Files/OpenSSL" `
            --editor $editors[0].FullName --redist $redists[0].FullName `
            --imgui-license build/editor-package/_deps/nexora_imgui-src/LICENSE.txt `
            --game-runtime-profile $profiles[0].FullName --cmake-root $cmakeRoot `
            --ninja $ninja --zig-root $zigRoot --ninja-license $ninjaLicense `
            --commit $env:GITHUB_SHA --output build/editor-delivery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: NexoraEditor-Windows-x64-${{ github.sha }}
          path: |
            build/editor-delivery/*.zip
            build/editor-delivery/*.sha256
            build/editor-delivery/verification/
            build/editor-package/Tests/Editor/editor-startup-splash*.bmp
            build/editor-package/Tests/Editor/startup-integration/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Editor-package-failure-${{ github.run_id }}
          path: |
            build/editor-delivery/verification/
            build/editor-package/Tests/Editor/startup-integration/
          if-no-files-found: ignore
