name: Build
on:
  push:
  pull_request:

# Push and PR events for an ED-M0 branch share a group. Other branches retain independent runs.
concurrency:
  group: build-${{ startsWith(github.head_ref || github.ref_name, 'codex/ed-m0-') && format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Documentation and change detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      full_build: ${{ steps.route.outputs.full_build }}
    steps:
      - name: Cancel superseded ED-M0 runs
        if: startsWith(github.head_ref || github.ref_name, 'codex/ed-m0-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            // Existing runs predate the concurrency group. Never cancel main or a current head.
            const branches = ['codex/ed-m0-native-validation', 'codex/ed-m0-desktop-parity',
                              'codex/ed-m0-surface-font-domain', 'codex/ed-m0-native-images'];
            for (const branch of branches) {
              try {
                const ref = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
                const head = ref.data.object.sha;
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns,
                  {owner, repo, workflow_id: 'build.yml', branch, per_page: 100});
                for (const run of runs) {
                  if (!['queued', 'in_progress'].includes(run.status) ||
                      run.head_branch !== branch || run.head_repository?.full_name !== `${owner}/${repo}` ||
                      run.head_sha === head || run.id === context.runId)
                    continue;
                  const current = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
                  if (current.data.object.sha !== head) {
                    core.info(`${branch} advanced during cleanup; keeping the new head's runs`);
                    break;
                  }
                  await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
                  core.info(`Cancelled superseded ${branch} run ${run.id} (${run.head_sha})`);
                }
              } catch (error) {
                // Cleanup is best-effort; missing/deleted refs or API races are not build failures.
                core.warning(`ED-M0 cleanup for ${branch}: ${error.message}`);
              }
            }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Markdown parser
        run: python3 -m pip install --requirement Tools/Build/documentation-requirements.txt
      - name: Test documentation routing
        run: python3 Tools/Build/TestDocumentationCI.py
      - name: Validate changed documentation and select build scope
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 Tools/Build/DocumentationCI.py --event "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME" --github-output "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    env:
      SLANG_VERSION: 2026.18
      NEXORA_SHOWCASE_EVIDENCE_DIR: ${{ github.workspace }}/build/${{ matrix.preset }}/showcase-visual-evidence
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-development
          - os: windows-latest
            preset: windows-development
          - os: macos-latest
            preset: macos-development
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Slang (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}:$(uname -m)" in
            Linux:x86_64) package="slang-${SLANG_VERSION}-linux-x86_64.tar.gz" ;;
            macOS:arm64) package="slang-${SLANG_VERSION}-macos-aarch64.tar.gz" ;;
            macOS:x86_64) package="slang-${SLANG_VERSION}-macos-x86_64.tar.gz" ;;
            *) echo "Unsupported Slang runner: ${RUNNER_OS} $(uname -m)" >&2; exit 1 ;;
          esac
          archive="${RUNNER_TEMP}/${package}"
          install_root="${RUNNER_TEMP}/slang"
          curl --fail --location --retry 3 --output "${archive}" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/${package}"
          mkdir -p "${install_root}"
          tar -xzf "${archive}" -C "${install_root}"
          slangc="$(find "${install_root}" -type f -name slangc -print -quit)"
          if [[ -z "${slangc}" ]]; then
            echo "slangc was not found in ${archive}" >&2
            exit 1
          fi
          echo "$(dirname "${slangc}")" >> "${GITHUB_PATH}"
          "${slangc}" -v
      - name: Install Slang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "slang-$env:SLANG_VERSION-windows-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $package
          $installRoot = Join-Path $env:RUNNER_TEMP "slang"
          curl.exe --fail --location --retry 3 `
            --output $archive `
            "https://github.com/shader-slang/slang/releases/download/v$env:SLANG_VERSION/$package"
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot -Force
          $slangc = Get-ChildItem -LiteralPath $installRoot -Filter slangc.exe -File -Recurse |
            Select-Object -First 1
          if ($null -eq $slangc) {
            throw "slangc.exe was not found in $archive"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $slangc.DirectoryName
          & $slangc.FullName -v
      - name: Install Vulkan and X11 development packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 libvulkan-dev mesa-vulkan-drivers libx11-dev xvfb xdotool glslang-tools
      - run: cmake --preset ${{ matrix.preset }} -DNEXORA_ENABLE_ZIG_GAMEPLAY=ON -DNEXORA_ENABLE_SLANG=ON -DNEXORA_ENABLE_VULKAN_BACKEND=${{ runner.os == 'Windows' && 'OFF' || 'ON' }} -DNEXORA_ENABLE_EDITOR_GRAPHICAL_SHELL=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - name: Require the graphical Editor contract
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} -N -R '^editor\.imgui_contract$' | grep -q 'Total Tests: 1'
      - name: Require the Windows DPI and IME contract
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ctest --preset ${{ matrix.preset }} -N -R '^editor\.windows_dpi_ime_contract$' | grep -q 'Total Tests: 1'
      - run: ctest --preset ${{ matrix.preset }} -V --output-log build/${{ matrix.preset }}/development-tests.log
      - name: Verify Development Showcase package
        run: cmake --build --preset ${{ matrix.preset }} --target NexoraShowcasePackageDevelopmentEvidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-${{ matrix.preset }}-package-evidence
          path: |
            build/${{ matrix.preset }}/package/NexoraShowcase-Development*
            build/${{ matrix.preset }}/showcase-visual-evidence/
            build/${{ matrix.preset }}/artifacts/showcase-linux-vulkan*/
            build/${{ matrix.preset }}/artifacts/metal-scene.ppm
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/development-tests.log

  # Runs the graphical Editor against a real X11 server (Xvfb) with Mesa's software Vulkan. It is a
  # separate job to require synchronization-layer diagnostics in addition to desktop parity.
  editor-linux-display:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    name: Editor Linux display acceptance (Xvfb)
    runs-on: ubuntu-latest
    env:
      SLANG_VERSION: 2026.18
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Slang
        shell: bash
        run: |
          set -euo pipefail
          package="slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          archive="${RUNNER_TEMP}/${package}"
          install_root="${RUNNER_TEMP}/slang"
          curl --fail --location --retry 3 --output "${archive}" \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/${package}"
          mkdir -p "${install_root}"
          tar -xzf "${archive}" -C "${install_root}"
          slangc="$(find "${install_root}" -type f -name slangc -print -quit)"
          if [[ -z "${slangc}" ]]; then
            echo "slangc was not found in ${archive}" >&2
            exit 1
          fi
          echo "$(dirname "${slangc}")" >> "${GITHUB_PATH}"
          "${slangc}" -v
      - name: Install Vulkan, X11, Xvfb and xdotool
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers libx11-dev xvfb xdotool glslang-tools
      - run: cmake --preset linux-development -DNEXORA_ENABLE_SLANG=ON -DNEXORA_ENABLE_VULKAN_BACKEND=ON -DNEXORA_ENABLE_EDITOR_GRAPHICAL_SHELL=ON
      - run: cmake --build --preset linux-development
      - name: Require the display acceptance to be registered
        # The test is only registered when Xvfb and xdotool are found; fail loudly instead of
        # silently skipping it if either goes missing.
        run: |
          ctest --preset linux-development -N -R '^editor\.linux_display_acceptance$' | grep -q 'Total Tests: 1'
      - name: Editor tests (includes the Xvfb display acceptance)
        run: ctest --preset linux-development -R '^editor\.' -V --output-log build/linux-development/editor-tests.log
      - name: Editor core and synchronization validation (Xvfb)
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          VK_LOADER_DEBUG: layer
        run: |
          ctest --preset linux-development -R '^editor\.(linux_(display_acceptance|validation_output)|native_surface_lifetime)$' -V --output-log build/linux-development/editor-validation.log
          grep -Eq 'Insert(ed)? device layer.*VK_LAYER_KHRONOS_validation' build/linux-development/editor-validation.log
      - name: Native Vulkan RHI and scene validation (Xvfb)
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          VK_LAYER_ENABLES: VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          VK_LOADER_DEBUG: layer
        run: |
          ctest --preset linux-development -R '^(renderer\.contracts|renderer\.v2_gpu_driven|window_presentation\.vulkan_(scene|pbr))$' -V --output-log build/linux-development/native-validation.log
          grep -Eq 'Insert(ed)? device layer.*VK_LAYER_KHRONOS_validation' build/linux-development/native-validation.log
          if grep -Eq 'Validation Error|VUID-|SYNC-HAZARD-' build/linux-development/native-validation.log; then
            echo "Native Vulkan validation reported an error" >&2
            exit 1
          fi
      - name: Retain Editor validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-linux-validation-logs
          path: |
            build/linux-development/editor-tests.log
            build/linux-development/editor-validation.log
            build/linux-development/native-validation.log
            build/linux-development/Testing/Temporary/LastTest*.log
          if-no-files-found: warn

  zig-mobile-cross-build:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    name: Zig object smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - aarch64-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Build Zig GameModule object
        run: >-
          zig build-obj
          --dep nexora
          -target ${{ matrix.target }}
          -O Debug
          -Mroot=Gameplay/Zig/src/game_module.zig
          -Mnexora=Bindings/Zig/nexora.zig
          -femit-bin=${{ runner.temp }}/nexora-${{ matrix.target }}.o

  showcase-windows-shipping-package:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset windows-showcase-shipping
      - run: cmake --build --preset windows-showcase-shipping --target NexoraShowcasePackageShippingEvidence --parallel 4
      - name: Native Windows isolated-copy visual acceptance
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tools/Package/AcceptShowcaseWindows.ps1 -PackageRoot build/windows-showcase-shipping/package/NexoraShowcase-Shipping -EvidenceDirectory build/windows-showcase-shipping/artifacts/showcase-windows-v1 -ExpectedBuildId ($env:GITHUB_SHA.Substring(0, 12)) -AllowUnavailableDisplay
          if ($LASTEXITCODE -eq 77) {
            Write-Host "Native visual acceptance is UNSUPPORTED: runner has no interactive desktop."
            exit 0
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-windows-shipping-evidence
          path: |
            build/windows-showcase-shipping/package/NexoraShowcase-Shipping*
            build/windows-showcase-shipping/artifacts/showcase-windows-v1/

  # Windows Vulkan parity: same Full Shipping package, but with the Vulkan backend ON so the
  # packaged app can be accepted with `accept-v1.ps1 -Backend vulkan` on a machine with a Vulkan GPU.
  # A pinned lavapipe CPU driver executes native Win32 Vulkan acceptance on hosted runners.
  # This is software-driver coverage; physical GPU acceptance remains separate.
  showcase-windows-vulkan-package:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
      - run: cmake --preset windows-showcase-vulkan-shipping
      - name: Build Vulkan package
        shell: pwsh
        run: |
          cmake --build --preset windows-showcase-vulkan-shipping --target NexoraShowcasePackageShippingEvidence --parallel 4 2>&1 | Tee-Object -FilePath vulkan-build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path vulkan-build.log -Pattern 'error' | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
          }
          exit $code
      - name: Set up checksum-verified Windows lavapipe
        shell: pwsh
        run: ./Tools/Build/SetupWindowsVulkanLavapipe.ps1 -Directory "$env:RUNNER_TEMP/nexora-mesa"
      - name: Native Vulkan isolated-copy screenshots and full guided tour
        shell: pwsh
        run: |
          $evidence = 'build/windows-showcase-vulkan-shipping/artifacts/showcase-windows-v1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tools/Package/AcceptShowcaseWindows.ps1 -PackageRoot build/windows-showcase-vulkan-shipping/package/NexoraShowcase-Shipping -EvidenceDirectory $evidence -ExpectedBuildId ($env:GITHUB_SHA.Substring(0, 12)) -Backend vulkan -CompleteGuidedTour -ExpectedVulkanDriverLibrary $env:NEXORA_CI_VULKAN_DRIVER_LIBRARY
          $code = $LASTEXITCODE
          Copy-Item "$env:RUNNER_TEMP/nexora-mesa/driver-provenance.json" "$evidence/driver-provenance.json"
          if ($code -ne 0) {
            Get-Content "$evidence/stderr.log" -ErrorAction SilentlyContinue
            Get-Content "$evidence/acceptance.json" -ErrorAction SilentlyContinue
            exit $code
          }
          $accepted = Get-Content "$evidence/acceptance.json" -Raw | ConvertFrom-Json
          if ($accepted.status -ne 'PASS' -or -not $accepted.native.software_rasterizer -or $accepted.physical_display_verified -or $accepted.clean_host_verified) {
            throw 'Expected native Vulkan software-driver acceptance without target-host attestations.'
          }
      - name: Remove hosted-runner lavapipe registration
        if: always()
        shell: pwsh
        run: ./Tools/Build/SetupWindowsVulkanLavapipe.ps1 -Directory "$env:RUNNER_TEMP/nexora-mesa" -RemoveRegistration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-windows-vulkan-package
          path: |
            build/windows-showcase-vulkan-shipping/package/NexoraShowcase-Shipping*
            build/windows-showcase-vulkan-shipping/artifacts/showcase-windows-v1/

  showcase-posix-shipping-package:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-showcase-shipping
          - os: macos-latest
            preset: macos-showcase-shipping
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev mesa-vulkan-drivers libx11-dev xvfb xdotool
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --target NexoraShowcasePackageShippingEvidence --parallel 4
      - name: Verify native isolated-copy package
        shell: bash
        run: |
          set +e
          python3 Tools/Package/VerifyShowcaseRelease.py \
            --package build/${{ matrix.preset }}/package/NexoraShowcase-Shipping \
            --evidence-directory build/${{ matrix.preset }}/artifacts/release-native \
            ${{ runner.os == 'macOS' && '--allow-unavailable-display' || '' }}
          code=$?
          if [[ $code == 77 ]]; then
            echo "Native display acceptance UNSUPPORTED; headless/package evidence retained."
            exit 0
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-${{ matrix.preset }}-evidence
          path: |
            build/${{ matrix.preset }}/package/NexoraShowcase-Shipping*
            build/${{ matrix.preset }}/artifacts/release-native/

  mimalloc-smoke:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    name: mimalloc backend (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-development
          - os: windows-latest
            preset: windows-development
          - os: macos-latest
            preset: macos-development
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Vulkan and X11 development packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 libvulkan-dev mesa-vulkan-drivers libx11-dev
      - run: cmake --preset ${{ matrix.preset }} -DNEXORA_ENABLE_MIMALLOC=ON -DNEXORA_ENABLE_VULKAN_BACKEND=${{ runner.os == 'Windows' && 'OFF' || 'ON' }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  mobile-configure-smoke:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    name: CMake configure smoke (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: android-development
            os: ubuntu-latest
          - preset: ios-development
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Android NDK
        if: matrix.preset == 'android-development'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Configure ${{ matrix.preset }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cmake --preset ${{ matrix.preset }}

  build-contract:
    needs: changes
    if: needs.changes.outputs.full_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install Vulkan and X11 development packages
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 libvulkan-dev mesa-vulkan-drivers libx11-dev
      # Shipping/Minimal intentionally strips Development-only test facilities. Its gate is
      # configure/build/package; executable contracts run in development and sanitizer presets.
      - run: cmake --preset linux-shipping -DNEXORA_ENABLE_ZIG_GAMEPLAY=ON
      - run: cmake --build --preset linux-shipping
      - run: cmake --build --preset linux-shipping --target NexoraShowcasePackageShippingEvidence
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-linux-shipping-package-evidence
          path: build/linux-shipping/package/NexoraShowcase-Shipping/launch-evidence-linux.json
      - run: cmake -S . -B build/feature-off -G Ninja -DCMAKE_BUILD_TYPE=Development -DNEXORA_FEATURE_EXAMPLE_PLUGIN=OFF
      - run: cmake --build build/feature-off
      - run: test ! -e build/feature-off/Plugins/Example/libNexoraExamplePlugin.so
      - run: cmake -DROOT=$PWD -P Tools/Build/ValidateModuleGraph.cmake
      - run: cmake -DROOT=$PWD -P Tools/Build/ValidatePluginManifests.cmake
      - run: cmake -DROOT=$PWD -P Tools/Build/ValidateShaderContract.cmake
      - run: cmake --preset linux-sanitizers
      - run: cmake --build --preset linux-sanitizers
      - run: ctest --preset linux-sanitizers
      # Mesa's uninstrumented driver reports internal mutex races during native teardown.
      # TSan validates portable engine concurrency; native gates remain in Development/ASan.
      - run: cmake --preset linux-thread-sanitizer -DNEXORA_ENABLE_NATIVE_BACKENDS=OFF
      - run: cmake --build --preset linux-thread-sanitizer
      - run: ctest --preset linux-thread-sanitizer

  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - desktop
      - editor-linux-display
      - zig-mobile-cross-build
      - showcase-windows-shipping-package
      - showcase-windows-vulkan-package
      - showcase-posix-shipping-package
      - mimalloc-smoke
      - mobile-configure-smoke
      - build-contract
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs selected by the route to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          jobs = json.loads(os.environ["JOB_RESULTS"])
          route = jobs.pop("changes")
          full = route["outputs"].get("full_build")
          expected = "success" if full == "true" else "skipped"
          failed = [name for name, job in jobs.items() if job["result"] != expected]
          if route["result"] != "success" or full not in {"true", "false"} or failed:
              sys.exit(f"CI failed: route={route['result']}, full_build={full}, unexpected jobs={failed}")
          print("PASS: " + ("full build" if full == "true" else "documentation only"))
          PYTHON
