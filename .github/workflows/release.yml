name: Release

# Builds desktop Shipping/Full Showcase packages for a version tag, runs the packaged
# isolated-copy verifier, requires the repository's Build workflow to pass for the same commit,
# and prepares a DRAFT GitHub Release. Nothing is published automatically; a person publishes the
# draft after reviewing it. workflow_dispatch is a dry run: it builds and uploads the bundle as a
# workflow artifact but never creates a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset windows-showcase-shipping
      - run: cmake --build --preset windows-showcase-shipping --target NexoraShowcasePackageShippingEvidence --parallel 4
      - name: Native Windows isolated-copy visual acceptance
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tools/Package/AcceptShowcaseWindows.ps1 -PackageRoot build/windows-showcase-shipping/package/NexoraShowcase-Shipping -EvidenceDirectory build/windows-showcase-shipping/artifacts/showcase-windows-v1 -ExpectedBuildId ($env:GITHUB_SHA.Substring(0, 12)) -AllowUnavailableDisplay
          if ($LASTEXITCODE -eq 77) {
            Write-Host "Native visual acceptance is UNSUPPORTED: runner has no interactive desktop."
            exit 0
          }
          exit $LASTEXITCODE
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.296.0
          install_runtime: false
          cache: true
      - run: cmake --preset windows-showcase-vulkan-shipping
      - run: cmake --build --preset windows-showcase-vulkan-shipping --target NexoraShowcasePackageShippingEvidence --parallel 4
      - name: Set up checksum-verified Windows lavapipe
        shell: pwsh
        run: ./Tools/Build/SetupWindowsVulkanLavapipe.ps1 -Directory "$env:RUNNER_TEMP/nexora-mesa"
      - name: Native Vulkan isolated-copy screenshots and full guided tour
        shell: pwsh
        run: |
          $evidence = 'build/windows-showcase-vulkan-shipping/artifacts/showcase-windows-v1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tools/Package/AcceptShowcaseWindows.ps1 -PackageRoot build/windows-showcase-vulkan-shipping/package/NexoraShowcase-Shipping -EvidenceDirectory $evidence -ExpectedBuildId ($env:GITHUB_SHA.Substring(0, 12)) -Backend vulkan -CompleteGuidedTour -ExpectedVulkanDriverLibrary $env:NEXORA_CI_VULKAN_DRIVER_LIBRARY
          $code = $LASTEXITCODE
          Copy-Item "$env:RUNNER_TEMP/nexora-mesa/driver-provenance.json" "$evidence/driver-provenance.json"
          if ($code -ne 0) { exit $code }
          $accepted = Get-Content "$evidence/acceptance.json" -Raw | ConvertFrom-Json
          if ($accepted.status -ne 'PASS' -or -not $accepted.native.software_rasterizer -or $accepted.physical_display_verified -or $accepted.clean_host_verified) {
            throw 'Expected native Vulkan software-driver acceptance without target-host attestations.'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-windows-vulkan
          path: build/windows-showcase-vulkan-shipping/artifacts/showcase-windows-v1/
      - name: Assemble release bundle
        shell: pwsh
        run: |
          $out = "release-bundle"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item build/windows-showcase-shipping/package/NexoraShowcase-Shipping.zip $out/
          Copy-Item build/windows-showcase-shipping/package/NexoraShowcase-Shipping.zip.sha256 $out/
          # Vulkan package and native Win32 lavapipe acceptance remain distinct from DX12 evidence.
          Copy-Item build/windows-showcase-vulkan-shipping/package/NexoraShowcase-Shipping.zip "$out/NexoraShowcase-Shipping-Vulkan.zip"
          $vkHash = (Get-FileHash "$out/NexoraShowcase-Shipping-Vulkan.zip" -Algorithm SHA256).Hash.ToLower()
          "$vkHash  NexoraShowcase-Shipping-Vulkan.zip" | Set-Content "$out/NexoraShowcase-Shipping-Vulkan.zip.sha256" -Encoding ascii
          Copy-Item build/windows-showcase-shipping/artifacts/showcase-windows-v1 "$out/windows-acceptance" -Recurse
          Copy-Item build/windows-showcase-vulkan-shipping/artifacts/showcase-windows-v1 "$out/windows-vulkan-acceptance" -Recurse
          $info = [ordered]@{
            git_commit = $env:GITHUB_SHA
            git_ref = $env:GITHUB_REF
            workflow_run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runner_os = $env:RUNNER_OS
            note = "Hosted-runner evidence only. Vulkan native screenshots, interactions and the complete guided tour use checksum-verified Mesa lavapipe, explicitly a software driver. Physical-GPU/clean-host and Mac full-interactive acceptance remain separate."
          }
          $info | ConvertTo-Json | Set-Content "$out/release-info.json" -Encoding utf8
          Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content "$out/RELEASE-SHA256SUMS" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-windows
          path: release-bundle/

  posix-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-showcase-shipping
            platform: linux-x64
          - os: macos-latest
            preset: macos-showcase-shipping
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev mesa-vulkan-drivers libx11-dev xvfb xdotool
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --target NexoraShowcasePackageShippingEvidence --parallel 4
      - name: Verify native isolated-copy package
        shell: bash
        run: |
          set +e
          python3 Tools/Package/VerifyShowcaseRelease.py \
            --package build/${{ matrix.preset }}/package/NexoraShowcase-Shipping \
            --evidence-directory build/${{ matrix.preset }}/artifacts/release-native \
            ${{ runner.os == 'macOS' && '--allow-unavailable-display' || '' }}
          code=$?
          if [[ $code == 77 ]]; then
            echo "Native display acceptance UNSUPPORTED; retained separately from headless PASS."
            exit 0
          fi
          exit "$code"
      - name: Assemble platform release bundle
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_PRESET: ${{ matrix.preset }}
        run: |
          set -euo pipefail
          mkdir release-bundle
          cp "build/${RELEASE_PRESET}/package/NexoraShowcase-Shipping.zip" "release-bundle/NexoraShowcase-Shipping-${RELEASE_PLATFORM}.zip"
          python3 Tools/Package/AssemblePosixRelease.py --bundle release-bundle \
            --platform "${RELEASE_PLATFORM}" --preset "${RELEASE_PRESET}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/artifacts/release-native/
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ matrix.platform }}
          path: release-bundle/

  require-passing-build:
    # The Build workflow runs on the same tag push; wait for it and require success.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the Build workflow on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 6600))
          while true; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs?head_sha=${GITHUB_SHA}&event=push" \
              --jq '.workflow_runs | sort_by(.created_at) | last | [.id, .status, (.conclusion // "")] | @tsv')"
            echo "Build workflow: ${run:-not found yet}"
            build_run_id="$(cut -f1 <<<"${run}")"
            status="$(cut -f2 <<<"${run}")"
            conclusion="$(cut -f3 <<<"${run}")"
            if [[ "${status}" == "completed" ]]; then
              [[ "${conclusion}" == "success" ]] || { echo "Build did not succeed (${conclusion})" >&2; exit 1; }
              break
            fi
            (( SECONDS < deadline )) || { echo "Timed out waiting for the Build workflow" >&2; exit 1; }
            sleep 60
          done
          gh run download "${build_run_id}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'showcase-*-package-evidence' --dir build-contract-evidence
          mkdir release-bundle
          python3 - <<'PYLOGS'
          from pathlib import Path
          import tarfile
          root = Path("build-contract-evidence")
          logs = sorted(root.rglob("LastTest.log"))
          if len(logs) != 3:
              raise SystemExit(f"Expected desktop CTest logs for Linux, Windows and macOS, got {len(logs)}")
          with tarfile.open("release-bundle/build-contract-evidence.tar.gz", "w:gz") as archive:
              for log in logs:
                  archive.add(log, arcname=log.relative_to(root).as_posix())
          PYLOGS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-bundle-contracts
          path: release-bundle/
      - name: Dry run
        if: github.event_name != 'push'
        run: echo "workflow_dispatch dry run - Build gate skipped and no release will be created."

  draft-release:
    if: github.event_name == 'push'
    needs: [windows-package, posix-package, require-passing-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: release-bundle
      - name: Create DRAFT release (a person publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C release-bundle -czf release-bundle/windows-acceptance.tar.gz windows-acceptance
          tar -C release-bundle -czf release-bundle/windows-vulkan-acceptance.tar.gz windows-vulkan-acceptance
          sha256sum release-bundle/*.zip release-bundle/*.tar.gz release-bundle/*info*.json | sed 's#release-bundle/##' > release-bundle/RELEASE-SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            release-bundle/NexoraShowcase-Shipping.zip \
            release-bundle/NexoraShowcase-Shipping.zip.sha256 \
            release-bundle/NexoraShowcase-Shipping-Vulkan.zip \
            release-bundle/NexoraShowcase-Shipping-Vulkan.zip.sha256 \
            release-bundle/windows-acceptance.tar.gz \
            release-bundle/windows-vulkan-acceptance.tar.gz \
            release-bundle/release-info.json \
            release-bundle/RELEASE-SHA256SUMS \
            release-bundle/build-contract-evidence.tar.gz \
            release-bundle/NexoraShowcase-Shipping-linux-x64.zip \
            release-bundle/NexoraShowcase-Shipping-linux-x64.zip.sha256 \
            release-bundle/NexoraShowcase-Shipping-macos-arm64.zip \
            release-bundle/NexoraShowcase-Shipping-macos-arm64.zip.sha256 \
            release-bundle/linux-x64-acceptance.tar.gz \
            release-bundle/macos-arm64-acceptance.tar.gz \
            release-bundle/release-info-linux-x64.json \
            release-bundle/release-info-macos-arm64.json
